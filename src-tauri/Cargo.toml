[package]
name = "gitdesktop"
version = "0.1.0"
description = "A fast, native desktop Git client"
authors = ["theBGuy"]
edition = "2021"
license = "Apache-2.0"
# Two binaries exist — the GUI app (`gitdesktop`) and the Tier-3 `gitdesktop-mcp`
# stdio server — so `cargo run` / `tauri dev` must be told which is the default.
default-run = "gitdesktop"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gitdesktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Tier-3 "GitDesktop AS an MCP server" lives in a second binary that reuses the
# lib crate's command cores. Gated behind the `mcp-server` feature + this target's
# required-features, so a normal `cargo build` / `tauri build` skips it and the GUI
# app never compiles or links rmcp. See docs/mcp-server-tier3.md.
[[bin]]
name = "gitdesktop-mcp"
path = "src/mcp_bin.rs"
required-features = ["mcp-server"]

[features]
mcp-server = ["dep:rmcp"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
trash = "5"
tokio = { version = "1", features = ["process", "time", "macros", "sync", "rt-multi-thread", "io-std"] }
thiserror = "2"
base64 = "0.22.1"
tauri-plugin-notification = "2.3.3"
os_info = "3"
portable-pty = "0.9"
# Tier-3 MCP server only (see the [[bin]] above). Optional so the GUI app build
# doesn't pull it in.
rmcp = { version = "1", optional = true, features = ["server", "macros", "transport-io"] }

# Desktop-only: the updater plugin doesn't build for mobile.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# Vendored portable-pty carrying a 1-line Windows ConPTY fix: pass NULL (not
# INVALID_HANDLE_VALUE) std handles when spawning the pty child, so it attaches to
# the pseudoconsole instead of allocating its own console window (which left the
# in-app terminal's output empty and "exited" immediately). See the patch comment in
# vendor/portable-pty/src/win/psuedocon.rs. Drop this when fixed upstream (wezterm).
[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }
